<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mula Group OG Image</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: #020617;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      position: relative;
      overflow: hidden;
    }
    
    /* Dot grid */
    .grid {
      position: absolute;
      inset: 0;
      opacity: 0.15;
      background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.08) 1px, transparent 0);
      background-size: 40px 40px;
    }
    
    /* Ambient glow */
    .glow {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 800px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(34,211,238,0.04) 0%, transparent 70%);
      filter: blur(100px);
    }
    
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 60px;
    }
    
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 32px;
      opacity: 0.9;
    }
    
    .logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .headline {
      font-size: 56px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 20px;
    }
    
    .headline .accent {
      color: #22d3ee;
    }
    
    .subheadline {
      font-size: 22px;
      color: #94a3b8;
      line-height: 1.5;
      max-width: 700px;
      margin: 0 auto 36px;
    }
    
    .tags {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    
    .tag {
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 13px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .url {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: #475569;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  
  <div class="content">
    <div class="logo">
      <img src="./logos_Mula_Group/1000x1000-white.png" alt="Mula Group">
    </div>
    
    <h1 class="headline">
      Infrastructure.<br>
      Security.<br>
      <span class="accent">Intelligence.</span>
    </h1>
    
    <p class="subheadline">
      Enterprise DevOps, security operations, AI automation, and infrastructure monitoring for modern digital operations.
    </p>
    
    <div class="tags">
      <span class="tag">DevOps</span>
      <span class="tag">Blue Teaming</span>
      <span class="tag">AI Automation</span>
      <span class="tag">Security</span>
    </div>
  </div>
  
  <div class="url">mulagroup.com</div>
</body>
</html>
